name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leftovers
          POSTGRES_PASSWORD: leftovers_ci_only
          POSTGRES_DB: leftovers_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leftovers -d leftovers_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      LEFTOVERS_TEST_DATABASE_URL: postgresql://leftovers:leftovers_ci_only@127.0.0.1:5432/leftovers_test
      LEFTOVERS_DATABASE_URL: postgresql://leftovers:leftovers_ci_only@127.0.0.1:5432/leftovers_test
      SMTP_PORT: "1025"
      MAILPIT_API: http://127.0.0.1:8025/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # S3-compatible stand-in for R2 (same image and flags as docker-compose.yml).
      - name: Start local object storage
        run: |
          docker run -d --name storage -p 127.0.0.1:9100:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 \
            -master.volumeSizeLimitMB=64 -volume.max=200 \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins='*'
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9100/healthz >/dev/null && exit 0
            sleep 2
          done
          docker logs storage
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations apply cleanly
        run: pnpm exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
