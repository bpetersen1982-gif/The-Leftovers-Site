# Local development services only. Production uses Railway Postgres and Resend.
# Ports are deliberately non-default so this never collides with other local projects.
name: leftovers

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leftovers
      POSTGRES_PASSWORD: leftovers_dev_only
      POSTGRES_DB: leftovers
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leftovers -d leftovers"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends in development. Web UI: http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
